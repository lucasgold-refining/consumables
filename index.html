<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14213d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Consumables">
<title>Refining Consumables</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{--navy:#14213d;--gold:#f5c442;--bg:#f4f6fa;--card:#fff;--text:#1d2433;--muted:#667085;--red:#c62828;--redbg:#fdecea;--green:#1b7f3b;--line:#e3e7ef}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:100%}
html,body{margin:0;background:var(--bg);color:var(--text);font:1.0625rem/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{overflow-wrap:break-word}
header{background:var(--navy);color:#fff;padding:calc(env(safe-area-inset-top) + 14px) 16px 14px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:1.25rem;font-weight:700;line-height:1.2}
header h1 span{color:var(--gold)}
main{padding:14px 14px calc(112px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto;min-width:0}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1 1 0;min-width:0;border:0;background:none;padding:8px 2px 10px;font-size:.72rem;line-height:1.15;color:var(--muted);min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;overflow-wrap:anywhere}
nav button .ic{font-size:1.35rem;line-height:1;flex:none}
nav button.on{color:var(--navy);font-weight:700}
nav button.on .ic{transform:scale(1.08)}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06);min-width:0;max-width:100%}
.card h2{margin:0 0 8px;font-size:1.125rem;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;line-height:1.25}
.big{font-size:clamp(1.6rem, 8vw, 1.875rem);font-weight:800;line-height:1.15;overflow-wrap:anywhere}
.unit{font-size:.9rem;color:var(--muted);font-weight:500}
.grid,.silvergrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(8.25rem,1fr));gap:8px;margin-top:8px}
.stat{background:var(--bg);border-radius:10px;padding:8px 10px;min-width:0;text-align:left}
.stat b{display:block;font-size:1.05rem;line-height:1.2;overflow-wrap:anywhere}
.stat small,.muted{color:var(--muted);font-size:.8125rem;overflow-wrap:anywhere}
.warn{background:var(--redbg);color:var(--red);border-radius:10px;padding:8px 10px;font-weight:700;margin-top:8px;font-size:.9rem}
.badge{font-size:.75rem;padding:3px 8px;border-radius:99px;background:#e8f5e9;color:var(--green);font-weight:700;white-space:normal}
.badge.low{background:var(--redbg);color:var(--red)}
.badge.full{background:#e8ecf4;color:var(--navy)}
.tablewrap{display:block;width:0;min-width:100%;max-width:100%;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem;margin-top:6px}
th,td{padding:8px 4px;text-align:right;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
th:first-child,td:first-child{text-align:left}
th{font-size:.75rem;color:var(--muted);font-weight:600}
tr.low td{color:var(--red);font-weight:700}
tr.total td{font-weight:800;border-bottom:0}
label{display:block;font-size:.875rem;font-weight:600;margin:12px 0 4px;color:#344054}
input,select,textarea,button{max-width:100%}
input,select,textarea{width:100%;font-size:1rem;padding:12px;border:1px solid #cdd3df;border-radius:10px;background:#fff;min-height:50px;color:var(--text)}
textarea{min-height:70px}
.btn{display:flex;width:100%;align-items:center;justify-content:center;gap:8px;text-align:center;white-space:normal;border:0;border-radius:12px;padding:14px;font-size:1rem;font-weight:700;line-height:1.25;min-height:54px;margin-top:14px;background:var(--navy);color:#fff}
.btn.gold{background:var(--gold);color:var(--navy)}
.btn.light{background:#e8ecf4;color:var(--navy)}
.btn.danger{background:var(--redbg);color:var(--red)}
.btn.sm{display:inline-flex;width:auto;min-height:44px;padding:8px 14px;margin:0;font-size:.9rem}
.seg{display:flex;flex-wrap:wrap;background:#e8ecf4;border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1 1 40%;min-width:0;border:0;border-radius:9px;padding:12px 6px;font-size:.95rem;font-weight:700;line-height:1.2;background:none;color:var(--muted);min-height:48px;white-space:normal}
.seg button.on{background:#fff;color:var(--navy);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.seg button.on.in{color:var(--green)}
.seg button.on.use{color:#b54708}
.seg button.on.recover{color:#075985}
.seg button.on.set{color:#3538cd}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(9.5rem,1fr));gap:10px}
.actgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(8.5rem,1fr));gap:8px;margin-top:8px}
.actgrid .btn{margin-top:0;min-height:52px}
.hist{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line);min-width:0}
.hist:last-child{border-bottom:0}
.hist .tag{font-size:.75rem;font-weight:800;padding:4px 8px;border-radius:8px;min-width:46px;text-align:center;flex:none}
.tag.in{background:#e8f5e9;color:var(--green)}
.tag.use{background:#fff4e5;color:#b54708}
.tag.recover{background:#e0f2fe;color:#075985}
.tag.set{background:#eef2ff;color:#3538cd}
.hist .body{flex:1;min-width:0;overflow-wrap:anywhere}
.hist .acts{display:flex;flex-direction:column;gap:6px;flex:none}
.hist .acts button{border:0;background:#e8ecf4;border-radius:10px;min-width:48px;min-height:44px;font-size:1.1rem}
.chips{display:flex;flex-wrap:wrap;gap:8px;min-width:0}
.chip{border:2px solid #cdd3df;background:#fff;border-radius:12px;min-height:48px;min-width:0;padding:8px 12px;font-size:1rem;font-weight:700;color:var(--text);max-width:100%}
.chip.on{border-color:var(--navy);background:var(--navy);color:#fff}
.setitem{border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:10px;min-width:0}
.sizerow{display:grid;grid-template-columns:minmax(0,1fr) 5.5rem 3rem;gap:6px;margin-top:6px;align-items:center}
.sizerow input{min-height:46px;padding:8px}
.iconbtn{border:0;background:var(--redbg);color:var(--red);border-radius:10px;min-height:46px;min-width:44px;font-size:1.1rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));background:#111;color:#fff;padding:12px 18px;border-radius:12px;font-size:.9rem;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;max-width:90%;text-align:center}
.toast.show{opacity:.92}
.empty{text-align:center;color:var(--muted);padding:24px 10px}
.hidden{display:none!important}
.filters{display:flex;gap:8px;min-width:0}
.filters select{min-width:0;min-height:46px;padding:8px}
table.sz{font-size:.85rem}
table.sz th,table.sz td{padding:7px 3px}
.batch{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:.9rem;min-width:0}
.batch:last-child{border-bottom:0}
.batch b{white-space:normal}
.btn.paid{background:var(--green);color:#fff}
.modal{position:fixed;inset:0;background:rgba(10,16,30,.55);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.modal .sheet{background:#fff;border-radius:18px 18px 0 0;width:100%;max-width:640px;max-height:92vh;overflow:auto;padding:16px 16px calc(16px + env(safe-area-inset-bottom));min-width:0}
.modal h2{margin:0 0 6px;font-size:1.15rem;line-height:1.3}
.chk{display:flex;gap:10px;align-items:flex-start;font-weight:500;font-size:.9rem;margin-top:12px}
.chk input{width:24px;min-height:24px;height:24px;flex:none;margin:0}
.period{border-bottom:1px solid var(--line);padding:10px 0;font-size:.9rem;min-width:0}
.period:last-child{border-bottom:0}
.period .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;flex-wrap:wrap}
.period .del{border:0;background:var(--redbg);color:var(--red);border-radius:10px;min-width:44px;min-height:40px;font-size:1rem;flex:none}
.curlist{border-left:5px solid var(--green)}
.silvercard{border-left:5px solid #9aa4b2}
.silverhero{text-align:center}
.silvercard .big{font-size:clamp(1.8rem, 10vw, 2.5rem)}
.stat.sol{background:#e7f1fb}
.hint{margin-top:6px}
</style>
</head>
<body>
<header><h1>⚗️ Refining <span>Consumables</span></h1></header>
<main id="app"></main>
<nav>
  <button type="button" data-v="dash" class="on"><span class="ic">📊</span>Dashboard</button>
  <button type="button" data-v="add"><span class="ic">➕</span>Add</button>
  <button type="button" data-v="hist"><span class="ic">📜</span>History</button>
  <button type="button" data-v="silver"><span class="ic">🥈</span>Silver</button>
  <button type="button" data-v="set"><span class="ic">⚙️</span>Settings</button>
</nav>
<div class="toast" id="toast"></div>
<input type="file" id="restoreFile" accept="application/json,.json" class="hidden">
<script>
'use strict';
const KEY = 'refining-consumables-v1';
const NITRIC_ID = 'nitric';
const APP_RELEASE = 'v7';
// v7: previous on-hand silver becomes regular. Flaked and in solution start at 0.
// Historical use entries stay in history and are not added to in solution.
const SILVER_MIG_NOTE = 'Previous on-hand silver was migrated to regular on hand. Flaked silver and silver in solution start at 0 kg. Historical use entries were kept and were not added to in solution.';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const round3 = n => Math.round((Number(n) || 0) * 1000) / 1000;
const round2 = n => Math.round((Number(n) || 0) * 100) / 100;
const DEFAULT_SIZES = ['#1','#2','#3','#4','#5','Medium','Jumbo','XL'];
const DEFAULT_PRICES = { '#1': 80, '#2': 90, '#3': 130, '#4': 150, '#5': 200, 'Medium': 300, 'Jumbo': 330, 'XL': 450 };
const DEFAULT_SIZE_IDS = { '#1': 's1', '#2': 's2', '#3': 's3', '#4': 's4', '#5': 's5', 'Medium': 'smed', 'Jumbo': 's6', 'XL': 's7' };
function defaultState() {
  return {
    version: 3,
    items: [
      { id: 'nitric', name: 'Nitric acid', unit: 'gallons', decimals: true, threshold: 0, sizes: [], packSize: 7, packName: 'containers', price: null },
      { id: 'crucible', name: 'Crucibles', unit: 'pcs', decimals: false, threshold: 0,
        sizes: DEFAULT_SIZES.map(n => ({ id: DEFAULT_SIZE_IDS[n], name: n, threshold: 2, archived: false, price: DEFAULT_PRICES[n] })) }
    ],
    entries: [],
    paid: [],
    silver: [], // {id, type:in|use|recover|set, kg, form:regular|flaked|solution, date, batch, note, created, legacy?}
    mig: { prices: true, medium: true, stampUse: true, container: true, silverForms: true }
  };
}
// Old single-balance silver (in +, use −, set = balance), used only to record the migrated regular kg.
function legacySingleBalance(list) {
  let bal = 0;
  const rows = (list || []).slice().sort((a, b) => (a.date || '').localeCompare(b.date || '') || (a.created || 0) - (b.created || 0));
  for (const e of rows) {
    const q = round3(e.kg);
    if (e.type === 'in') bal += q;
    else if (e.type === 'use') bal -= q;
    else if (e.type === 'set') bal = q;
    bal = round3(bal);
  }
  return bal;
}
// One-time upgrades for data saved by older versions (never wipes anything).
function migrate(st) {
  st.mig = st.mig || {};
  const cr = st.items.find(i => i.id === 'crucible');
  if (cr && Array.isArray(cr.sizes)) {
    if (!st.mig.prices) { // add default unit prices to crucible sizes that have none
      for (const z of cr.sizes) if (z.price == null && DEFAULT_PRICES[z.name] != null) z.price = DEFAULT_PRICES[z.name];
      st.mig.prices = true;
    }
    if (!st.mig.medium) { // add the Medium size between #5 and Jumbo
      if (!cr.sizes.some(z => String(z.name).trim().toLowerCase() === 'medium')) {
        const nz = { id: cr.sizes.some(z => z.id === 'smed') ? uid() : 'smed', name: 'Medium', threshold: 2, archived: false, price: DEFAULT_PRICES.Medium };
        let at = cr.sizes.findIndex(z => z.name === '#5') + 1;
        if (at <= 0) { at = cr.sizes.findIndex(z => z.name === 'Jumbo'); if (at < 0) at = cr.sizes.length; }
        cr.sizes.splice(at, 0, nz);
      }
      st.mig.medium = true;
    }
  }
  if (!st.mig.stampUse) { // lock today's price onto older use entries so later price changes don't rewrite history
    for (const e of st.entries) {
      if (e.type !== 'use' || e.unitPrice != null) continue;
      const it = st.items.find(i => i.id === e.itemId); const z = it && it.sizes ? it.sizes.find(x => x.id === e.sizeId) : null;
      if (z && z.price != null && z.price !== '') e.unitPrice = Number(z.price);
    }
    st.mig.stampUse = true;
  }
  if (!st.mig.container) { // nitric acid: show containers alongside gallons (1 container ≈ 7 gallons)
    const ni = st.items.find(i => i.id === 'nitric');
    if (ni && ni.packSize == null) { ni.packSize = 7; ni.packName = ni.packName || 'containers'; }
    st.mig.container = true;
  }
  if (!Array.isArray(st.paid)) st.paid = [];
  if (!Array.isArray(st.silver)) st.silver = [];
  if (!st.mig.silverForms) {
    // v7 silver cycle. Replay of these legacy lines is regular on hand only.
    // A historical use must not create an in-solution balance.
    const regularKg = legacySingleBalance(st.silver);
    let legacyEntries = 0;
    for (const e of st.silver) {
      if (e.type === 'in' || e.type === 'use' || e.type === 'set') {
        if (e.legacy == null) e.legacy = true;
        if (e.form !== 'flaked') e.form = 'regular';
        legacyEntries++;
      }
    }
    st.silverMigration = {
      note: SILVER_MIG_NOTE,
      regularKg,
      flakedKg: 0,
      solutionKg: 0,
      legacyEntries
    };
    st.mig.silverForms = true;
  }
  st.version = 3;
  return st;
}
let S;
function load() {
  try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) { S = null; }
  if (!S || !Array.isArray(S.items) || !Array.isArray(S.entries)) S = defaultState();
  const before = JSON.stringify(S); migrate(S); if (JSON.stringify(S) !== before) save();
}
function save() { localStorage.setItem(KEY, JSON.stringify(S)); }
load();
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

// ---------- helpers ----------
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pesoS = n => '₱' + Number(n || 0).toLocaleString('en-PH', { maximumFractionDigits: 2 });
const peso = n => '₱' + Number(n || 0).toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtQ = (n, item) => { const v = Math.round((Number(n) || 0) * 1000) / 1000; return item && !item.decimals ? String(Math.round(v)) : v.toLocaleString('en-GB', { maximumFractionDigits: 3 }); };
const todayISO = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
const fmtDate = iso => { if (!iso) return ''; const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }); };
const fmtDateNum = iso => { if (!iso) return ''; const [y, m, d] = iso.split('-'); return `${d}/${m}/${y}`; };
const item = id => S.items.find(i => i.id === id);
const size = (it, sid) => it && it.sizes ? it.sizes.find(s => s.id === sid) : null;
const hasSizes = it => it && it.sizes && it.sizes.length > 0;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2200); }
const hasPrice = z => z && z.price != null && z.price !== '' && !isNaN(z.price);
function curPrice(itemId, sizeId) { const z = size(item(itemId), sizeId); return hasPrice(z) ? Number(z.price) : null; }
// v6: stock tracking removed. Only 'use' entries count; old 'in' (stock-in / carried-over) entries are ignored and hidden.
const isUse = e => e && e.type !== 'in';
const useEntries = () => S.entries.filter(isUse);
const isNitricEntry = e => !!(e && e.itemId === NITRIC_ID);
const nitricUses = () => useEntries().filter(isNitricEntry);
function itemPrice(it) { const p = it && it.price; return p != null && p !== '' && !isNaN(p) && Number(p) >= 0 ? Number(p) : null; } // optional price per unit for items without sizes (e.g. nitric ₱/gallon). Blank stays unset.
function entryCost(e) { // cost of a use entry
  if (!isUse(e)) return null;
  const it = item(e.itemId);
  if (it && !hasSizes(it)) { const p = itemPrice(it); return p == null ? null : round2((Number(e.qty) || 0) * p); } // current ₱/unit setting; blank = not counted
  if (e.unitPrice == null || e.unitPrice === '' || isNaN(e.unitPrice)) return null; // sized items: unit price stored at time of logging
  return round2((Number(e.qty) || 0) * Number(e.unitPrice));
}
function packOf(it) { const n = Number(it && it.packSize); return n > 0 ? n : null; }
function packTxt(q, it) { // e.g. "≈ 4.2 containers"
  const ps = packOf(it); if (!ps) return '';
  return `≈ ${(Math.round((Number(q) || 0) / ps * 10) / 10).toLocaleString('en-GB', { minimumFractionDigits: 1, maximumFractionDigits: 1 })} ${esc(it.packName || 'containers')}`;
}

function stats(itemId, sizeId) {
  // sizeId undefined = all sizes combined. Use entries only (no stock / week / month figures).
  const r = { used: 0, useWithGrams: 0, grams: 0, useCost: 0, usePriced: 0 };
  for (const e of S.entries) {
    if (!isUse(e) || e.itemId !== itemId) continue;
    if (sizeId !== undefined && (e.sizeId || '') !== (sizeId || '')) continue;
    const q = Number(e.qty) || 0;
    r.used += q;
    if (Number(e.grams) > 0) { r.useWithGrams += q; r.grams += Number(e.grams); }
    const c = entryCost(e);
    if (c != null) { r.usePriced++; r.useCost += c; }
  }
  r.used = round3(r.used); r.useCost = round2(r.useCost);
  r.perGram = r.grams > 0 ? r.useWithGrams / r.grams : null;
  return r;
}

// ---------- views ----------
let view = 'dash';
let form = null; // {type,itemId,sizeId,editId}
let histFilter = { item: '' };
function go(v) { view = v; document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.v === v)); render(); window.scrollTo(0, 0); }
document.querySelectorAll('nav button').forEach(b => b.onclick = () => { if (b.dataset.v === 'add') form = null; if (b.dataset.v === 'silver') silverForm = null; go(b.dataset.v); });

function render() {
  const app = $('#app');
  if (view === 'dash') app.innerHTML = dashHTML();
  else if (view === 'add') { app.innerHTML = addHTML(); bindAdd(); }
  else if (view === 'hist') { app.innerHTML = histHTML(); }
  else if (view === 'set') { app.innerHTML = setHTML(); }
  else if (view === 'silver') { app.innerHTML = silverHTML(); bindSilver(); }
}

function dashHTML() {
  let h = '';
  for (const it of S.items) {
    const tot = stats(it.id);
    if (hasSizes(it)) {
      const sizes = it.sizes.filter(s => !s.archived || stats(it.id, s.id).used !== 0);
      let rows = '';
      for (const s of sizes) {
        const st = stats(it.id, s.id);
        rows += `<tr ${st.used === 0 ? 'style="color:#98a2b3"' : ''}><td>${esc(s.name)}</td><td>${fmtQ(st.used, it)}</td><td>${hasPrice(s) ? pesoS(s.price) : '–'}</td><td>${st.usePriced ? pesoS(st.useCost) : '–'}</td></tr>`;
      }
      h += `<div class="card" id="card-${esc(it.id)}"><h2>${esc(it.name)} <span class="muted">${fmtQ(tot.used, it)} ${esc(it.unit)} used</span></h2>
      <div class="big">${pesoS(tot.useCost)} <span class="unit">total cost</span></div>
      <div class="tablewrap"><table class="sz"><thead><tr><th>Size</th><th>Used</th><th>Price</th><th>Cost</th></tr></thead><tbody>${rows}
      <tr class="total"><td>Total</td><td>${fmtQ(tot.used, it)}</td><td></td><td>${tot.usePriced ? pesoS(tot.useCost) : '–'}</td></tr></tbody></table></div>
      ${tot.perGram != null ? `<div class="muted" style="margin-top:6px">Usage: ≈ ${(tot.grams / tot.useWithGrams).toLocaleString('en-GB', { maximumFractionDigits: 1 })} g of gold refined per ${esc(singular(it.unit))}</div>` : ''}
      <div class="muted" style="margin-top:6px">Price = current unit price (Settings) · Cost = used × price at time of use</div></div>`;
    } else {
      const p = itemPrice(it);
      h += `<div class="card" id="card-${esc(it.id)}"><h2>${esc(it.name)} <span class="muted">used</span></h2>

function archivedEntryIds() {

  const dates = ents.map(e => e.date).filter(Boolean).sort();
  const out = { from: dates[0] || '', to: dates[dates.length - 1] || '', count: ents.length, items: [], total: 0, entryIds: ents.map(e => e.id) };
  for (const it of S.items) {
    const mine = ents.filter(e => e.itemId === it.id); if (!mine.length) continue;
    const r = { name: it.name, unit: it.unit, decimals: !!it.decimals, used: 0, cost: 0, priced: false };
    if (hasSizes(it)) {

      for (const z of it.sizes) {
        const us = mine.filter(e => e.sizeId === z.id); if (!us.length) continue;
        let q = 0, c = 0, pr = false; for (const e of us) { q += Number(e.qty) || 0; const ec = entryCost(e); if (ec != null) { c += ec; pr = true; } }
        r.sizes.push({ name: z.name, qty: q, cost: round2(c), priced: pr }); r.used += q; r.cost += c; if (pr) r.priced = true;

      if (packOf(it)) { r.packSize = packOf(it); r.packName = it.packName || 'containers'; }
      if (itemPrice(it) != null) r.price = itemPrice(it);
      r.costNote = r.priced ? `used × ${pesoS(itemPrice(it))}/${singular(it.unit)}` : 'no price set – not in total';

}

function stamp() { return todayISO(); }
async function deliver(name, text, mime) {
  const blob = new Blob([text], { type: mime });

    const file = new File([blob], name, { type: mime });
    if (navigator.canShare && navigator.canShare({ files: [file] }) && /Android|iPhone|iPad/i.test(navigator.userAgent)) { await navigator.share({ files: [file], title: name }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

function buildExport(list, name) {

  const rows = (Array.isArray(list) ? list : S.entries).filter(isUse).slice().sort((a, b) => (a.date || '').localeCompare(b.date || '')).map(e => {
    const it = item(e.itemId); const s = size(it, e.sizeId);
    const ec = entryCost(e);
    return [fmtDateNum(e.date), 'Use', it ? it.name : '', s ? s.name : '', e.qty, it ? it.unit : '',
      ec != null ? ec.toFixed(2) : '',
      ec != null ? Number(hasSizes(it) ? e.unitPrice : itemPrice(it)).toFixed(2) : '',
      e.batch || '', e.grams ?? '', e.note || ''];
  });
  if (!Array.isArray(list)) { // full export: add silver holdings log (Paid-list CSV covers consumables only)
    for (const { e, after } of silverLedger()) {
      const kind = e.type === 'recover' ? 'Silver recovered' : e.type === 'in' ? 'Silver in' : e.type === 'use' ? 'Silver use' : 'Silver count (set balance)';
      const formLabel = e.legacy && e.type === 'set' ? 'Regular' : e.form === 'flaked' ? 'Flaked' : e.form === 'solution' ? 'In solution' : 'Regular';
      const bits = [e.note || '', e.legacy && e.type === 'use' ? 'historical use not added to in solution' : '', `regular ${fmtKg(after.regular)} kg`, `flaked ${fmtKg(after.flaked)} kg`, `in solution ${fmtKg(after.solution)} kg`].filter(Boolean);
      rows.push([fmtDateNum(e.date), kind, 'Silver', formLabel, e.kg, 'kg', '', '', e.batch || '', '', bits.join(' · ')]);
    }

  const keepSilver = Array.isArray(d.silver) ? '' : ' Silver records already on this phone are kept.';
  if (!confirm(`Restore backup with ${d.items.length} items and ${d.entries.filter(isUse).length} entries${silverNote}? This replaces the data on this phone.${keepSilver}`)) return false;
  const keepPhoneSilver = !Array.isArray(d.silver);
  const next = {
    version: d.version || 1,
    items: d.items,
    entries: d.entries,
    paid: Array.isArray(d.paid) ? d.paid : (S.paid || []),
    silver: keepPhoneSilver ? (S.silver || []) : d.silver,
    mig: d.mig ? Object.assign({}, d.mig) : {}
  };
  // A backup saved before silver tracking, or one that omitted silver, must not
  // reclassify the silver already on this phone as pre-v7 history.
  if (keepPhoneSilver && S.mig && S.mig.silverForms) next.mig.silverForms = true;
  if (d.silverMigration) next.silverMigration = d.silverMigration;
  else if (keepPhoneSilver && S.silverMigration) next.silverMigration = S.silverMigration;
  S = migrate(JSON.parse(JSON.stringify(next)));
  save(); render(); toast('Backup restored');
  return true;
}
$('#restoreFile').onchange = async ev => {
  const f = ev.target.files[0]; ev.target.value = ''; if (!f) return;
  try { applyBackup(JSON.parse(await f.text())); } catch (e) { alert('That file is not a valid backup.'); }
};
// Import from a link: index.html#import=data/some-file.json (same-origin .json under data/ only)
async function importFromHash() {
  const m = location.hash.match(/^#import=(.+)$/); if (!m) return;
  history.replaceState(null, '', location.pathname + location.search); // clear hash so it never re-runs
  let path; try { path = decodeURIComponent(m[1]); } catch (e) { return; }
  const url = new URL(path, location.href);
  if (url.origin !== location.origin || !/\/data\/[^/]+\.json$/.test(url.pathname)) return alert('That import link is not valid.');
  url.searchParams.set('t', Date.now()); // bypass service worker / HTTP caches
  try {
    const r = await fetch(url.href, { cache: 'no-store' });
    if (!r.ok) throw new Error('http ' + r.status);
    applyBackup(await r.json());
  } catch (e) { alert('Could not load the import file. Check your internet connection and open the link again.'); }
}

render();
importFromHash();
window.addEventListener('hashchange', importFromHash);
if ('serviceWorker' in navigator && location.protocol !== 'file:' && !/[?&]nosw=1(?:&|$)/.test(location.search)) navigator.serviceWorker.register('sw.js').catch(() => {});
