<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14213d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Consumables">
<title>Refining Consumables</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{--navy:#14213d;--gold:#f5c442;--bg:#f4f6fa;--card:#fff;--text:#1d2433;--muted:#667085;--red:#c62828;--redbg:#fdecea;--green:#1b7f3b;--line:#e3e7ef}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:17px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header{background:var(--navy);color:#fff;padding:calc(env(safe-area-inset-top) + 14px) 16px 14px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:20px;font-weight:700}
header h1 span{color:var(--gold)}
main{padding:14px 14px calc(96px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;border:0;background:none;padding:10px 4px 12px;font-size:13px;color:var(--muted);min-height:64px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button .ic{font-size:22px;line-height:1}
nav button.on{color:var(--navy);font-weight:700}
nav button.on .ic{transform:scale(1.1)}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card h2{margin:0 0 8px;font-size:18px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.big{font-size:30px;font-weight:800}
.unit{font-size:15px;color:var(--muted);font-weight:500}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.stat{background:var(--bg);border-radius:10px;padding:8px 10px}
.stat b{display:block;font-size:17px}
.stat small,.muted{color:var(--muted);font-size:13px}
.warn{background:var(--redbg);color:var(--red);border-radius:10px;padding:8px 10px;font-weight:700;margin-top:8px;font-size:15px}
.badge{font-size:12px;padding:3px 8px;border-radius:99px;background:#e8f5e9;color:var(--green);font-weight:700;white-space:nowrap}
.badge.low{background:var(--redbg);color:var(--red)}
table{width:100%;border-collapse:collapse;font-size:15px;margin-top:6px}
th,td{padding:8px 4px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{font-size:12px;color:var(--muted);font-weight:600}
tr.low td{color:var(--red);font-weight:700}
tr.total td{font-weight:800;border-bottom:0}
label{display:block;font-size:14px;font-weight:600;margin:12px 0 4px;color:#344054}
input,select,textarea{width:100%;font-size:17px;padding:12px;border:1px solid #cdd3df;border-radius:10px;background:#fff;min-height:50px;color:var(--text)}
textarea{min-height:70px}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font-size:17px;font-weight:700;min-height:54px;margin-top:14px;background:var(--navy);color:#fff}
.btn.gold{background:var(--gold);color:var(--navy)}
.btn.light{background:#e8ecf4;color:var(--navy)}
.btn.danger{background:var(--redbg);color:var(--red)}
.btn.sm{display:inline-block;width:auto;min-height:44px;padding:8px 14px;margin:0;font-size:15px}
.seg{display:flex;background:#e8ecf4;border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;border-radius:9px;padding:12px;font-size:16px;font-weight:700;background:none;color:var(--muted);min-height:48px}
.seg button.on{background:#fff;color:var(--navy);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.seg button.on.in{color:var(--green)}
.seg button.on.use{color:#b54708}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hist{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.hist:last-child{border-bottom:0}
.hist .tag{font-size:12px;font-weight:800;padding:4px 8px;border-radius:8px;min-width:46px;text-align:center}
.tag.in{background:#e8f5e9;color:var(--green)}
.tag.use{background:#fff4e5;color:#b54708}
.hist .body{flex:1;min-width:0}
.hist .acts{display:flex;flex-direction:column;gap:6px}
.hist .acts button{border:0;background:#e8ecf4;border-radius:10px;min-width:48px;min-height:44px;font-size:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid #cdd3df;background:#fff;border-radius:12px;min-height:48px;min-width:58px;padding:8px 12px;font-size:16px;font-weight:700;color:var(--text)}
.chip.on{border-color:var(--navy);background:var(--navy);color:#fff}
.setitem{border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:10px}
.sizerow{display:grid;grid-template-columns:1fr 92px 48px;gap:6px;margin-top:6px;align-items:center}
.sizerow input{min-height:46px;padding:8px}
.iconbtn{border:0;background:var(--redbg);color:var(--red);border-radius:10px;min-height:46px;font-size:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));background:#111;color:#fff;padding:12px 18px;border-radius:12px;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;max-width:90%}
.toast.show{opacity:.92}
.empty{text-align:center;color:var(--muted);padding:24px 10px}
.hidden{display:none!important}
.filters{display:flex;gap:8px}
table.sz{font-size:14px}
table.sz th,table.sz td{padding:7px 3px}
.batch{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.batch:last-child{border-bottom:0}
.batch b{white-space:nowrap}
.sizerow.p{grid-template-columns:1fr 70px 84px 44px}
.filters select{min-height:46px;padding:8px}
.btn.paid{background:var(--green);color:#fff}
.modal{position:fixed;inset:0;background:rgba(10,16,30,.55);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.modal .sheet{background:#fff;border-radius:18px 18px 0 0;width:100%;max-width:640px;max-height:92vh;overflow:auto;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.modal h2{margin:0 0 6px;font-size:19px}
.chk{display:flex;gap:10px;align-items:flex-start;font-weight:500;font-size:15px;margin-top:12px}
.chk input{width:24px;min-height:24px;height:24px;flex:none;margin:0}
.period{border-bottom:1px solid var(--line);padding:10px 0;font-size:15px}
.period:last-child{border-bottom:0}
.period .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.period .del{border:0;background:var(--redbg);color:var(--red);border-radius:10px;min-width:44px;min-height:40px;font-size:16px}
.curlist{border-left:5px solid var(--green)}
nav button{font-size:12px}
.silvercard{border-left:5px solid #9aa4b2;text-align:center}
.silvercard .big{font-size:40px}
.tag.set{background:#eef2ff;color:#3538cd}
.seg.three button{font-size:14px;padding:10px 4px}
.seg button.on.set{color:#3538cd}
</style>
</head>
<body>
<header><h1>⚗️ Refining <span>Consumables</span></h1></header>
<main id="app"></main>
<nav>
  <button data-v="dash" class="on"><span class="ic">📊</span>Dashboard</button>
  <button data-v="add"><span class="ic">➕</span>Add</button>
  <button data-v="hist"><span class="ic">📜</span>History</button>
  <button data-v="silver"><span class="ic">🥈</span>Silver</button>
  <button data-v="set"><span class="ic">⚙️</span>Settings</button>
</nav>
<div class="toast" id="toast"></div>
<input type="file" id="restoreFile" accept="application/json,.json" class="hidden">
<script>
'use strict';
const KEY = 'refining-consumables-v1';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const DEFAULT_SIZES = ['#1','#2','#3','#4','#5','Medium','Jumbo','XL'];
const DEFAULT_PRICES = { '#1': 80, '#2': 90, '#3': 130, '#4': 150, '#5': 200, 'Medium': 300, 'Jumbo': 330, 'XL': 450 };
const DEFAULT_SIZE_IDS = { '#1': 's1', '#2': 's2', '#3': 's3', '#4': 's4', '#5': 's5', 'Medium': 'smed', 'Jumbo': 's6', 'XL': 's7' };
function defaultState() {
  return {
    version: 1,
    items: [
      { id: 'nitric', name: 'Nitric acid', unit: 'gallons', decimals: true, threshold: 0, sizes: [], packSize: 7, packName: 'containers', price: null },
      { id: 'crucible', name: 'Crucibles', unit: 'pcs', decimals: false, threshold: 0,
        sizes: DEFAULT_SIZES.map(n => ({ id: DEFAULT_SIZE_IDS[n], name: n, threshold: 2, archived: false, price: DEFAULT_PRICES[n] })) }
    ],
    entries: [],
    paid: [],
    silver: [], // silver holdings log (kg) — separate from entries; never cleared by "Paid – start new list"
    mig: { prices: true, medium: true, stampUse: true, container: true }
  };
}
// One-time upgrades for data saved by older versions (never wipes anything).
function migrate(st) {
  st.mig = st.mig || {};
  const cr = st.items.find(i => i.id === 'crucible');
  if (cr && Array.isArray(cr.sizes)) {
    if (!st.mig.prices) { // add default unit prices to crucible sizes that have none
      for (const z of cr.sizes) if (z.price == null && DEFAULT_PRICES[z.name] != null) z.price = DEFAULT_PRICES[z.name];
      st.mig.prices = true;
    }
    if (!st.mig.medium) { // add the Medium size between #5 and Jumbo
      if (!cr.sizes.some(z => String(z.name).trim().toLowerCase() === 'medium')) {
        const nz = { id: cr.sizes.some(z => z.id === 'smed') ? uid() : 'smed', name: 'Medium', threshold: 2, archived: false, price: DEFAULT_PRICES.Medium };
        let at = cr.sizes.findIndex(z => z.name === '#5') + 1;
        if (at <= 0) { at = cr.sizes.findIndex(z => z.name === 'Jumbo'); if (at < 0) at = cr.sizes.length; }
        cr.sizes.splice(at, 0, nz);
      }
      st.mig.medium = true;
    }
  }
  if (!st.mig.stampUse) { // lock today's price onto older use entries so later price changes don't rewrite history
    for (const e of st.entries) {
      if (e.type !== 'use' || e.unitPrice != null) continue;
      const it = st.items.find(i => i.id === e.itemId); const z = it && it.sizes ? it.sizes.find(x => x.id === e.sizeId) : null;
      if (z && z.price != null && z.price !== '') e.unitPrice = Number(z.price);
    }
    st.mig.stampUse = true;
  }
  if (!st.mig.container) { // nitric acid: show containers alongside gallons (1 container ≈ 7 gallons)
    const ni = st.items.find(i => i.id === 'nitric');
    if (ni && ni.packSize == null) { ni.packSize = 7; ni.packName = ni.packName || 'containers'; }
    st.mig.container = true;
  }
  if (!Array.isArray(st.paid)) st.paid = [];
  if (!Array.isArray(st.silver)) st.silver = []; // v5: silver holdings tab
  st.version = 2;
  return st;
}
let S;
function load() {
  try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) { S = null; }
  if (!S || !Array.isArray(S.items) || !Array.isArray(S.entries)) S = defaultState();
  const before = JSON.stringify(S); migrate(S); if (JSON.stringify(S) !== before) save();
}
function save() { localStorage.setItem(KEY, JSON.stringify(S)); }
load();
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

// ---------- helpers ----------
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pesoS = n => '₱' + Number(n || 0).toLocaleString('en-PH', { maximumFractionDigits: 2 });
const peso = n => '₱' + Number(n || 0).toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtQ = (n, item) => { const v = Math.round((Number(n) || 0) * 1000) / 1000; return item && !item.decimals ? String(Math.round(v)) : v.toLocaleString('en-GB', { maximumFractionDigits: 3 }); };
const todayISO = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
const fmtDate = iso => { if (!iso) return ''; const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }); };
const fmtDateNum = iso => { if (!iso) return ''; const [y, m, d] = iso.split('-'); return `${d}/${m}/${y}`; };
const item = id => S.items.find(i => i.id === id);
const size = (it, sid) => it && it.sizes ? it.sizes.find(s => s.id === sid) : null;
const hasSizes = it => it && it.sizes && it.sizes.length > 0;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2200); }
const hasPrice = z => z && z.price != null && z.price !== '' && !isNaN(z.price);
function curPrice(itemId, sizeId) { const z = size(item(itemId), sizeId); return hasPrice(z) ? Number(z.price) : null; }
// v6: stock tracking removed. Only 'use' entries count; old 'in' (stock-in / carried-over) entries are ignored and hidden.
const isUse = e => e && e.type !== 'in';
const useEntries = () => S.entries.filter(isUse);
function itemPrice(it) { const p = it && it.price; return p != null && p !== '' && !isNaN(p) && Number(p) >= 0 ? Number(p) : null; } // optional price per unit for items without sizes (e.g. nitric ₱/gallon)
function entryCost(e) { // cost of a use entry
  if (!isUse(e)) return null;
  const it = item(e.itemId);
  if (it && !hasSizes(it)) { const p = itemPrice(it); return p == null ? null : Math.round((Number(e.qty) || 0) * p * 100) / 100; } // current ₱/unit setting; blank = not counted
  if (e.unitPrice == null || e.unitPrice === '' || isNaN(e.unitPrice)) return null; // sized items: unit price stored at time of logging
  return Math.round((Number(e.qty) || 0) * Number(e.unitPrice) * 100) / 100;
}
function packOf(it) { const n = Number(it && it.packSize); return n > 0 ? n : null; }
function packTxt(q, it) { // e.g. "≈ 4.2 containers"
  const ps = packOf(it); if (!ps) return '';
  return `≈ ${(Math.round((Number(q) || 0) / ps * 10) / 10).toLocaleString('en-GB', { minimumFractionDigits: 1, maximumFractionDigits: 1 })} ${esc(it.packName || 'containers')}`;
}

function stats(itemId, sizeId) {
  // sizeId undefined = all sizes combined. Use entries only (no stock / week / month figures).
  const r = { used: 0, useWithGrams: 0, grams: 0, useCost: 0, usePriced: 0 };
  for (const e of S.entries) {
    if (!isUse(e) || e.itemId !== itemId) continue;
    if (sizeId !== undefined && (e.sizeId || '') !== (sizeId || '')) continue;
    const q = Number(e.qty) || 0;
    r.used += q;
    if (Number(e.grams) > 0) { r.useWithGrams += q; r.grams += Number(e.grams); }
    const c = entryCost(e);
    if (c != null) { r.usePriced++; r.useCost += c; }
  }
  r.used = Math.round(r.used * 1000) / 1000; r.useCost = Math.round(r.useCost * 100) / 100;
  r.perGram = r.grams > 0 ? r.useWithGrams / r.grams : null;
  return r;
}

// ---------- views ----------
let view = 'dash';
let form = null; // {type,itemId,sizeId,editId}
let histFilter = { item: '' };
function go(v) { view = v; document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.v === v)); render(); window.scrollTo(0, 0); }
document.querySelectorAll('nav button').forEach(b => b.onclick = () => { if (b.dataset.v === 'add') form = null; if (b.dataset.v === 'silver') silverForm = null; go(b.dataset.v); });

function render() {
  const app = $('#app');
  if (view === 'dash') app.innerHTML = dashHTML();
  else if (view === 'add') { app.innerHTML = addHTML(); bindAdd(); }
  else if (view === 'hist') { app.innerHTML = histHTML(); }
  else if (view === 'set') { app.innerHTML = setHTML(); }
  else if (view === 'silver') { app.innerHTML = silverHTML(); bindSilver(); }
}

function dashHTML() {
  let h = '';
  for (const it of S.items) {
    const tot = stats(it.id);
    if (hasSizes(it)) {
      const sizes = it.sizes.filter(s => !s.archived || stats(it.id, s.id).used !== 0);
      let rows = '';
      for (const s of sizes) {
        const st = stats(it.id, s.id);
        rows += `<tr ${st.used === 0 ? 'style="color:#98a2b3"' : ''}><td>${esc(s.name)}</td><td>${fmtQ(st.used, it)}</td><td>${hasPrice(s) ? pesoS(s.price) : '–'}</td><td>${st.usePriced ? pesoS(st.useCost) : '–'}</td></tr>`;
      }
      h += `<div class="card" id="card-${esc(it.id)}"><h2>${esc(it.name)} <span class="muted">${fmtQ(tot.used, it)} ${esc(it.unit)} used</span></h2>
      <div class="big">${pesoS(tot.useCost)} <span class="unit">total cost</span></div>
      <table class="sz"><thead><tr><th>Size</th><th>Used</th><th>Price</th><th>Cost</th></tr></thead><tbody>${rows}
      <tr class="total"><td>Total</td><td>${fmtQ(tot.used, it)}</td><td></td><td>${tot.usePriced ? pesoS(tot.useCost) : '–'}</td></tr></tbody></table>
      ${tot.perGram != null ? `<div class="muted" style="margin-top:6px">Usage: ≈ ${(tot.grams / tot.useWithGrams).toLocaleString('en-GB', { maximumFractionDigits: 1 })} g of gold refined per ${esc(singular(it.unit))}</div>` : ''}
      <div class="muted" style="margin-top:6px">Price = current unit price (Settings) · Cost = used × price at time of use</div></div>`;
    } else {
      const p = itemPrice(it);
      h += `<div class="card" id="card-${esc(it.id)}"><h2>${esc(it.name)} <span class="muted">used</span></h2>
      <div class="big">${fmtQ(tot.used, it)} <span class="unit">${esc(it.unit)}${packOf(it) ? ' ' + packTxt(tot.used, it) : ''}</span></div>
      ${p != null ? `<div class="grid"><div class="stat"><small>Price / ${esc(singular(it.unit))}</small><b>${pesoS(p)}</b></div><div class="stat"><small>Total cost</small><b>${pesoS(tot.useCost)}</b></div></div>`
        : `<div class="muted" style="margin-top:6px">No price set, so ${esc(it.name.toLowerCase())} is not included in the total to pay. You can add a price per ${esc(singular(it.unit))} in Settings.</div>`}
      ${tot.perGram != null ? `<div class="muted" style="margin-top:6px">Per gram of gold: ${fmtQ(tot.perGram, { decimals: true })} ${esc(it.unit)}</div>` : ''}</div>`;
    }
  }
  const empty = useEntries().length === 0 ? `<div class="card empty">No entries yet.<br>Tap <b>Add</b> to log what you used.</div>` : '';
  return empty + curListHTML() + h + `<button class="btn" onclick="startAdd('use')">− Log use</button>`;
}
function singular(u) { u = String(u || ''); if (u === 'pcs') return 'pc'; return u.endsWith('s') ? u.slice(0, -1) : u; }
function startAdd() { form = { type: 'use' }; go('add'); }

function addHTML() {
  const f = form || (form = { type: 'use' });
  const e = f.editId ? S.entries.find(x => x.id === f.editId) : null;
  if (e && !f.loaded) Object.assign(f, { itemId: e.itemId, sizeId: e.sizeId, loaded: true });
  f.type = 'use';
  if (!f.itemId || !item(f.itemId)) f.itemId = S.items[0] && S.items[0].id;
  const it = item(f.itemId);
  if (!it) return `<div class="card empty">Add an item in Settings first.</div>`;
  const sizes = hasSizes(it) ? it.sizes.filter(s => !s.archived || s.id === f.sizeId) : [];
  if (hasSizes(it) && f.sizeId && !size(it, f.sizeId)) f.sizeId = null;
  const v = e || {};
  const sameSize = e && e.itemId === f.itemId && (e.sizeId || null) === (f.sizeId || null);
  const cp = hasSizes(it) && f.sizeId ? curPrice(it.id, f.sizeId) : null;
  const up = e && e.type === 'use' && sameSize && e.unitPrice != null ? e.unitPrice : cp; // keep the stored price when editing
  const showUP = f.type === 'use' && hasSizes(it) && (up != null || it.sizes.some(hasPrice));
  f.price = cp;
  return `<div class="card">
  <h2>${e ? 'Edit usage' : 'Log usage'}</h2>
  <label>Item</label>
  <div class="chips" id="itemChips">${S.items.map(i => `<button class="chip ${i.id === f.itemId ? 'on' : ''}" data-i="${i.id}">${esc(i.name)}</button>`).join('')}</div>
  ${hasSizes(it) ? `<label>Size <span style="color:var(--red)">*</span></label><div class="chips" id="sizeChips">${sizes.map(s => `<button class="chip ${s.id === f.sizeId ? 'on' : ''}" data-s="${s.id}">${esc(s.name)}</button>`).join('')}</div>` : ''}
  <div class="row2">
    <div><label>Quantity (${esc(it.unit)})</label><input id="qty" type="number" inputmode="${it.decimals ? 'decimal' : 'numeric'}" step="${it.decimals ? 'any' : '1'}" min="0" value="${esc(v.qty ?? '')}" placeholder="0"></div>
    <div><label>Date</label><input id="date" type="date" value="${esc(v.date || todayISO())}"></div>
  </div>

function periodSummary() { // totals for the current list of entries
  const ents = useEntries(); const dates = ents.map(e => e.date).filter(Boolean).sort();
  const out = { from: dates[0] || '', to: dates[dates.length - 1] || '', count: ents.length, items: [], total: 0 };
  for (const it of S.items) {
    const mine = ents.filter(e => e.itemId === it.id); if (!mine.length) continue;
    const r = { name: it.name, unit: it.unit, decimals: !!it.decimals, used: 0, cost: 0, priced: false };
    if (hasSizes(it)) {
      r.sizes = [];
      for (const z of it.sizes) {
        const us = mine.filter(e => e.sizeId === z.id); if (!us.length) continue;
        let q = 0, c = 0, pr = false; for (const e of us) { q += Number(e.qty) || 0; const ec = entryCost(e); if (ec != null) { c += ec; pr = true; } }
        r.sizes.push({ name: z.name, qty: q, cost: Math.round(c * 100) / 100, priced: pr }); r.used += q; r.cost += c; if (pr) r.priced = true;
      }
      r.costNote = 'used × price';
    } else {
      for (const e of mine) { r.used += Number(e.qty) || 0; const ec = entryCost(e); if (ec != null) { r.cost += ec; r.priced = true; } }
      if (packOf(it)) { r.packSize = packOf(it); r.packName = it.packName || 'containers'; }
      if (itemPrice(it) != null) r.price = itemPrice(it);
      r.costNote = r.priced ? `used × ${pesoS(itemPrice(it))}/${singular(it.unit)}` : 'no price set – not in total';
    }
    r.used = Math.round(r.used * 1000) / 1000; r.cost = Math.round(r.cost * 100) / 100; out.total += r.cost;
    out.items.push(r);
  }
  out.total = Math.round(out.total * 100) / 100;
  return out;
}

function packsOf(q, ps) { return Math.round((Number(q) || 0) / ps * 10) / 10; }
function summaryHTML(p) {

    const iu = { decimals: r.decimals };
    if (r.sizes) return `<table class="sz"><thead><tr><th>${esc(r.name)}</th><th>Used</th><th>Cost</th></tr></thead><tbody>
      ${r.sizes.map(z => `<tr><td>${esc(z.name)}</td><td>${fmtQ(z.qty, iu)}</td><td>${z.priced ? pesoS(z.cost) : '–'}</td></tr>`).join('')}
      <tr class="total"><td>Total</td><td>${fmtQ(r.used, iu)} ${esc(r.unit)}</td><td>${r.priced ? pesoS(r.cost) : '–'}</td></tr></tbody></table>`;
    return `<div class="batch"><div><b>${esc(r.name)}</b><br><span class="muted">${fmtQ(r.used, iu)} ${esc(r.unit)} used${r.packSize ? ` ≈ ${packsOf(r.used, r.packSize).toLocaleString('en-GB', { minimumFractionDigits: 1, maximumFractionDigits: 1 })} ${esc(r.packName)}` : ''}${r.costNote ? ' · ' + esc(r.costNote) : ''}</span></div><b>${r.priced ? pesoS(r.cost) : '–'}</b></div>`;
  }).join('') + `<div class="batch" style="font-size:17px"><b>Overall total</b><b>${pesoS(p.total)}</b></div>`;
}
function curListHTML() {
  if (!useEntries().length) return '';
  const p = periodSummary();
  return `<div class="card curlist"><h2>Current list <span class="muted">${p.count} entries</span></h2>
    <div class="muted">${rangeTxt(p.from, p.to)}</div>
    <div class="big" style="margin-top:4px">${pesoS(p.total)} <span class="unit">to pay</span></div>
    <button class="btn paid" onclick="openPaid()">✅ Paid – start new list</button></div>`;
}
let paidCSVDone = false;
function openPaid() {
  if (!useEntries().length) return toast('No entries to clear');
  closePaid(); paidCSVDone = false;
  const p = periodSummary();
  const m = document.createElement('div'); m.className = 'modal'; m.id = 'paidModal';
  m.innerHTML = `<div class="sheet" role="dialog" aria-label="Paid – start new list">
    <h2>✅ Paid – start new list?</h2>
    <div class="muted">${rangeTxt(p.from, p.to)} · ${p.count} entries</div>
    ${summaryHTML(p)}
    <button class="btn light" id="paidCSV">⬇️ Save CSV of these entries (optional)</button>
    <div class="muted" style="margin-top:10px">This saves the totals above to <b>Paid periods</b> and clears all ${p.count} entries. Items, sizes, prices and container settings are kept. Silver on hand is not affected.</div>
    <button class="btn paid" id="paidOK">Mark as paid &amp; clear entries</button>
    <button class="btn light" id="paidCancel">Cancel</button></div>`;
  document.body.appendChild(m);
  m.addEventListener('click', ev => { if (ev.target === m) closePaid(); });
  $('#paidCancel').onclick = closePaid;
  $('#paidCSV').onclick = async () => { try { await exportCSV(useEntries(), `consumables-${p.from || 'start'}_to_${p.to || stamp()}.csv`); paidCSVDone = true; } catch (e) { toast('Could not save the file'); } };
  $('#paidOK').onclick = () => confirmPaid(p);
}
function closePaid() { const m = $('#paidModal'); if (m) m.remove(); }
function confirmPaid(p) {
  const today = todayISO();
  S.paid = S.paid || [];
  S.paid.unshift({ id: uid(), from: p.from, to: p.to, paidOn: today, paidAt: Date.now(), count: p.count, items: p.items, total: p.total });
  S.entries = []; // new list starts empty (old hidden stock-in entries are cleared too)
  save(); closePaid(); render(); toast('Marked as paid ✓ New list started');
}
function paidListHTML() {
  const L = S.paid || [];
  if (!L.length) return `<div class="card"><h2>Paid periods</h2><div class="muted">None yet. Tap “Paid – start new list” after you pay for a list.</div></div>`;
  return `<div class="card" id="paidList"><h2>Paid periods <span class="muted">${L.length}</span></h2>
    ${L.map(a => `<div class="period"><div class="top"><div><b>${rangeTxt(a.from, a.to)}</b><br><span class="muted">Paid ${fmtDate(a.paidOn)} · ${a.count} entries</span></div>
      <div style="display:flex;gap:8px;align-items:center"><b>${pesoS(a.total)}</b><button class="del" aria-label="Delete paid period" onclick="delPaid('${a.id}')">🗑️</button></div></div>
      <div class="muted" style="margin-top:4px">${(a.items || []).map(r => r.sizes
        ? `${esc(r.name)}: ${fmtQ(r.used, { decimals: r.decimals })} ${esc(r.unit)}${r.priced ? ' ' + pesoS(r.cost) : ''} (${r.sizes.map(z => `${fmtQ(z.qty, { decimals: r.decimals })}× ${esc(z.name)}${z.priced ? ' ' + pesoS(z.cost) : ''}`).join(', ')})`
        : `${esc(r.name)}: ${fmtQ(r.used, { decimals: r.decimals })} ${esc(r.unit)}${r.packSize ? ` ≈ ${packsOf(r.used, r.packSize).toLocaleString('en-GB', { minimumFractionDigits: 1, maximumFractionDigits: 1 })} ${esc(r.packName)}` : ''}${r.priced ? ' ' + pesoS(r.cost) : ''}`).join('<br>')}</div></div>`).join('')}</div>`;
}
function delPaid(id) {
  const a = (S.paid || []).find(x => x.id === id); if (!a) return;
  if (!confirm(`Delete the paid period ${rangeTxt(a.from, a.to)} (${pesoS(a.total)}) from the archive?`)) return;
  S.paid = S.paid.filter(x => x.id !== id); save(); render(); toast('Paid period deleted');
}

// ---------- export / backup ----------
function stamp() { return todayISO(); }
async function deliver(name, text, mime) {
  const blob = new Blob([text], { type: mime });
  try {
    const file = new File([blob], name, { type: mime });
    if (navigator.canShare && navigator.canShare({ files: [file] }) && /Android|iPhone|iPad/i.test(navigator.userAgent)) { await navigator.share({ files: [file], title: name }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function csvCell(v) { v = v == null ? '' : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
function exportCSV(list, name) {
  const head = ['Date', 'Type', 'Item', 'Size', 'Quantity', 'Unit', 'Cost (PHP)', 'Cost per unit (PHP)', 'Batch', 'Gold refined (g)', 'Note'];
  const rows = (Array.isArray(list) ? list : S.entries).filter(isUse).slice().sort((a, b) => (a.date || '').localeCompare(b.date || '')).map(e => {
    const it = item(e.itemId); const s = size(it, e.sizeId);
    const ec = entryCost(e);
    return [fmtDateNum(e.date), 'Use', it ? it.name : '', s ? s.name : '', e.qty, it ? it.unit : '',
      ec != null ? ec.toFixed(2) : '',
      ec != null ? Number(hasSizes(it) ? e.unitPrice : itemPrice(it)).toFixed(2) : '',
      e.batch || '', e.grams ?? '', e.note || ''];
  });
  if (!Array.isArray(list)) { // full export: add silver holdings log (Paid-list CSV covers consumables only)
    for (const { e, after } of silverLedger()) rows.push([fmtDateNum(e.date), e.type === 'in' ? 'Silver in' : e.type === 'use' ? 'Silver use' : 'Silver count (set balance)', 'Silver', '', e.kg, 'kg', '', '', e.batch || '', '', [e.note || '', 'balance ' + fmtKg(after) + ' kg'].filter(Boolean).join(' · ')]);
  }
  const csv = '\ufeff' + [head, ...rows].map(r => r.map(csvCell).join(',')).join('\r\n');
  return deliver(name || `consumables-${stamp()}.csv`, csv, 'text/csv');
}
function exportJSON() { deliver(`consumables-backup-${stamp()}.json`, JSON.stringify({ app: 'refining-consumables', exported: new Date().toISOString(), ...S }, null, 2), 'application/json'); }
function applyBackup(d) { // shared by file Restore and link import; returns true if data was replaced
  if (!d || !Array.isArray(d.items) || !Array.isArray(d.entries)) throw new Error('bad');
  if (!confirm(`Restore backup with ${d.items.length} items and ${d.entries.filter(isUse).length} entries${Array.isArray(d.silver) ? ` and ${d.silver.length} silver entries` : ''}? This replaces the data on this phone.${Array.isArray(d.silver) ? '' : ' Your silver records are kept.'}`)) return false;
  S = migrate({ version: d.version || 1, items: d.items, entries: d.entries, paid: Array.isArray(d.paid) ? d.paid : (S.paid || []), silver: Array.isArray(d.silver) ? d.silver : (S.silver || []), mig: d.mig || {} }); save(); render(); toast('Backup restored');
  return true;
}
$('#restoreFile').onchange = async ev => {
  const f = ev.target.files[0]; ev.target.value = ''; if (!f) return;
  try { applyBackup(JSON.parse(await f.text())); } catch (e) { alert('That file is not a valid backup.'); }
};
// Import from a link: index.html#import=data/some-file.json (same-origin .json under data/ only)
async function importFromHash() {
  const m = location.hash.match(/^#import=(.+)$/); if (!m) return;
  history.replaceState(null, '', location.pathname + location.search); // clear hash so it never re-runs
  let path; try { path = decodeURIComponent(m[1]); } catch (e) { return; }
  const url = new URL(path, location.href);
  if (url.origin !== location.origin || !/\/data\/[^/]+\.json$/.test(url.pathname)) return alert('That import link is not valid.');
  url.searchParams.set('t', Date.now()); // bypass service worker / HTTP caches
  try {
    const r = await fetch(url.href, { cache: 'no-store' });
    if (!r.ok) throw new Error('http ' + r.status);
    applyBackup(await r.json());
  } catch (e) { alert('Could not load the import file. Check your internet connection and open the link again.'); }
}

render();
importFromHash();
window.addEventListener('hashchange', importFromHash);
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
